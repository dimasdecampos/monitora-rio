name: Coletar histórico e publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 9 * * *"   # todo dia às 06:20 (horário de Brasília)
  workflow_dispatch:         # permite rodar manualmente na aba Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar mês atual e anterior de todas as bacias (ANA e SP Águas)
        if: github.event_name != 'push'
        run: python scripts/coletar.py

      - name: Estatísticas para as visões do painel
        if: github.event_name != 'push'
        run: python scripts/estatisticas.py

      - name: Salvar histórico no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/*/historico public/*/estatisticas.json
          if git diff --cached --quiet; then
            echo "Nada novo."
          else
            git commit -m "Histórico $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Montar o site (painel e modo TV em cada bacia) e conferir as configurações
        run: python scripts/montar_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
