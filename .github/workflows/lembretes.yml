name: Lembretes de revisão

# Uma vez por mês: se alguma bacia tem previsao.gatilho.revisar_em vencido, abre um issue atribuído ao
# dono do repositório (é a atribuição que gera o e-mail: o dono não "acompanha" o repositório).
# Não abre de novo se já houver um aberto com o mesmo título. O repositório é público: o issue também é.
# Toda segunda-feira: vencimentos de .github/lembretes.json (ex.: token do GitHub) avisados no app ntfy, no
# tópico <NTFY_TOPIC>-admin, que só o dono assina (os tópicos das bacias são do público).
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      teste:
        description: "Mandar agora uma mensagem de teste no tópico ntfy -admin"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  lembrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir datas de revisão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > vencidos.txt
          import json, glob, datetime
          hoje = datetime.date.today().isoformat()
          for f in sorted(glob.glob("public/*/config.json")):
              c = json.load(open(f, encoding="utf-8"))
              g = (c.get("previsao") or {}).get("gatilho") or {}
              if g.get("revisar_em") and g["revisar_em"] <= hoje:
                  print(c["id"])
          PY
          while read -r bacia; do
            titulo="Revisar o gatilho rio acima da previsão ($bacia)"
            if gh issue list --state open --search "\"$titulo\" in:title" --json number -q 'length' | grep -qv '^0$'; then
              echo "já existe: $titulo"; continue
            fi
            gh issue create --title "$titulo" --assignee "$GITHUB_REPOSITORY_OWNER" --body "Chegou a data de revisão (previsao.gatilho.revisar_em em public/$bacia/config.json).

          1. Atualize os dados: python scripts/modelo_cheias/baixar_chuva.py, baixar_prev7.py e baixar_pluviometro.py.
          2. Mude o fim do teste em scripts/modelo_cheias/gatilho_rio_acima.py para incluir a última temporada de chuva.
          3. Rode python scripts/modelo_cheias/gatilho_rio_acima.py e veja se o limite (sobe_cm) ainda avisa todas as cheias com poucos alarmes falsos.
          4. Atualize previsao.gatilho (limite, teste e uma nova data em revisar_em) e o README."
          done < vencidos.txt

      - name: Vencimentos (aviso privado no ntfy)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TESTE: ${{ inputs.teste && '1' || '0' }}
        run: |
          python - <<'PY'
          import json, os, datetime, urllib.request
          topico = os.environ.get("NTFY_TOPIC")
          if not topico:
              raise SystemExit("sem NTFY_TOPIC: nada a avisar")
          def avisar(titulo, texto):
              req = urllib.request.Request(f"https://ntfy.sh/{topico}-admin", data=texto.encode("utf-8"),
                                           method="POST", headers={"Title": titulo.encode("utf-8").decode("latin-1"), "Priority": "4"})
              urllib.request.urlopen(req, timeout=30)
          hoje = datetime.date.today()
          if os.environ.get("TESTE") == "1":
              avisar("Teste: lembretes do Monitor dos Rios", "Se chegou, os avisos de vencimento vão chegar aqui.")
              print("teste enviado")
          for v in json.load(open(".github/lembretes.json", encoding="utf-8"))["vencimentos"]:
              dias = (datetime.date.fromisoformat(v["vence"]) - hoje).days
              if dias > v.get("avisar_dias_antes", 14):
                  print(f"ok: {v['nome']} vence em {dias} dias"); continue
              titulo = f"Vence em {dias} dias: {v['nome']}" if dias >= 0 else f"VENCEU há {-dias} dias: {v['nome']}"
              avisar(titulo, v["como_renovar"])
              print("avisado:", titulo)
          PY
