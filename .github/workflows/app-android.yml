name: Gerar app Android

# Gera o app da Play Store (o painel em tela cheia, Trusted Web Activity) e o APK para instalar direto.
# Rode na aba Actions → "Gerar app Android" → Run workflow. O resultado fica em "Artifacts" no fim da página.
# Precisa dos segredos ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_SENHA (veja playstore/LEIAME.md).
# O código da versão (versionCode) é o número da rodada, então cada geração é maior que a anterior.

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Nome da versão (ex.: 1.0.1). Vazio = o de android/app.json"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Conferir a chave do app
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: |
          if [ -z "$KS" ] || [ -z "$SENHA" ]; then
            echo "::error::Faltam os segredos ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_SENHA (veja playstore/LEIAME.md)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gerar o projeto Android a partir do manifesto do site
        env:
          VERSAO: ${{ inputs.versao }}
        run: |
          cd android
          npm install --no-audit --no-fund
          node gerar.js ${{ github.run_number }}

      - name: Compilar (APK e AAB)
        run: |
          cd android/projeto
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Assinar
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: |
          ALIAS=$(python3 -c "import json;print(json.load(open('android/app.json'))['keyAlias'])")
          CHAVE="$RUNNER_TEMP/chave.keystore"
          echo "$KS" | base64 -d > "$CHAVE"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SAIDA="$GITHUB_WORKSPACE/saida"; mkdir -p "$SAIDA"
          OUT=android/projeto/app/build/outputs
          NOME="monitor-dos-rios-$(python3 -c "import json;print(json.load(open('android/projeto/twa-manifest.json'))['appVersion'])")-${{ github.run_number }}"

          "$BT/zipalign" -p -f 4 "$OUT/apk/release/app-release-unsigned.apk" "$RUNNER_TEMP/alinhado.apk"
          "$BT/apksigner" sign --ks "$CHAVE" --ks-type PKCS12 --ks-key-alias "$ALIAS" \
            --ks-pass env:SENHA --key-pass env:SENHA --out "$SAIDA/$NOME.apk" "$RUNNER_TEMP/alinhado.apk"
          "$BT/apksigner" verify --print-certs "$SAIDA/$NOME.apk" | grep -i sha-256

          cp "$OUT/bundle/release/app-release.aab" "$SAIDA/$NOME.aab"
          jarsigner -keystore "$CHAVE" -storetype PKCS12 -storepass:env SENHA -keypass:env SENHA \
            -sigalg SHA256withRSA -digestalg SHA-256 "$SAIDA/$NOME.aab" "$ALIAS"
          jarsigner -verify "$SAIDA/$NOME.aab" | tail -1
          rm -f "$CHAVE"

          {
            echo "### App gerado: $NOME"
            echo "- \`.apk\`: instalar direto no celular"
            echo "- \`.aab\`: enviar para a Play Console"
            echo "Baixe em **Artifacts**, no fim desta página."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: app-android-${{ github.run_number }}
          path: saida/
          retention-days: 30
